table:
  name: representative_portfolio_exits
  schema: public
object_relationships:
  - name: agent
    using:
      foreign_key_constraint_on: agent_id
  - name: business
    using:
      foreign_key_constraint_on: business_id
select_permissions:
  - role: agent
    permission:
      columns:
        - business_id
        - agent_id
        - exited_at
        - reason
      filter:
        agent:
          user:
            id:
              _eq: X-Hasura-User-Id
