table:
  name: rental_availability_subscriptions
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: client
    using:
      foreign_key_constraint_on: client_id
  - name: category
    using:
      foreign_key_constraint_on: category_id
  - name: notified_listing
    using:
      foreign_key_constraint_on: notified_listing_id
array_relationships:
  - name: notice
    using:
      foreign_key_constraint_on:
        column: subscription_id
        table:
          name: rental_availability_notices
          schema: public
