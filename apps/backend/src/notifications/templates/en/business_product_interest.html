<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New product interest</title>
  </head>
  <body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1>New product interest</h1>
    <p>
      <strong>{{{clientName}}}</strong> is interested in
      <strong>{{{itemName}}}</strong>
      <span> at <strong>{{{locationName}}}</strong>.</span>
    </p>
    <p>
      Contact:<br />
      <strong>{{{clientContact}}}</strong>
    </p>
    <p>
      Note:<br />
      <strong>{{{clientNote}}}</strong>
    </p>
    <p>Request ID: {{{requestId}}}</p>
    <p>
      Follow up with the client by phone or email outside Rendasua. View leads in your
      <a href="{{{dashboardUrl}}}">product interest inbox</a>.
    </p>
  </body>
</html>
