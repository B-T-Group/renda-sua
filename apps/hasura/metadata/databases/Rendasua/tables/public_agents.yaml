table:
  name: agents
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: mobile_payment_phone
    using:
      foreign_key_constraint_on: mobile_payment_phone_id
  - name: vehicle_type
    using:
      foreign_key_constraint_on: vehicle_type_id
  - name: referring_agent
    using:
      foreign_key_constraint_on: referred_by_agent_id
  - name: referring_business
    using:
      foreign_key_constraint_on: referred_by_business_id
array_relationships:
  - name: representative_compensation_events
    using:
      foreign_key_constraint_on:
        column: earner_agent_id
        table:
          name: representative_compensation_events
          schema: public
  - name: agent_addresses
    using:
      manual_configuration:
        column_mapping:
          id: agent_id
        insertion_order: null
        remote_table:
          name: agent_addresses
          schema: public
  - name: agent_locations
    using:
      manual_configuration:
        column_mapping:
          id: agent_id
        insertion_order: null
        remote_table:
          name: agent_locations
          schema: public
  - name: agent_restorations
    using:
      manual_configuration:
        column_mapping:
          id: agent_id
        insertion_order: null
        remote_table:
          name: agent_restorations
          schema: public
  - name: agent_strikes
    using:
      manual_configuration:
        column_mapping:
          id: agent_id
        insertion_order: null
        remote_table:
          name: agent_strikes
          schema: public
  - name: order_holds
    using:
      manual_configuration:
        column_mapping:
          id: agent_id
        insertion_order: null
        remote_table:
          name: order_holds
          schema: public
  - name: orders
    using:
      manual_configuration:
        column_mapping:
          id: assigned_agent_id
        insertion_order: null
        remote_table:
          name: orders
          schema: public
  - name: ratings_received
    using:
      manual_configuration:
        column_mapping:
          id: rated_entity_id
        insertion_order: null
        remote_table:
          name: ratings
          schema: public
insert_permissions:
  - role: agent
    permission:
      check:
        user:
          id:
            _eq: X-Hasura-User-Id
      columns:
        - user_id
        - vehicle_type_id
        - is_verified
  - role: business
    permission:
      check: {}
      columns:
        - id
        - user_id
        - vehicle_type_id
        - created_at
        - updated_at
        - is_verified
  - role: client
    permission:
      check: {}
      columns:
        - id
        - user_id
        - vehicle_type_id
        - created_at
        - updated_at
        - is_verified
  - role: user
    permission:
      check: {}
      columns:
        - id
        - user_id
        - vehicle_type_id
        - created_at
        - updated_at
        - is_verified
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - user_id
        - vehicle_type_id
        - agent_code
        - created_at
        - updated_at
        - is_verified
        - is_internal
        - onboarding_complete
        - status
        - is_available
        - auto_withdraw_commissions
        - mobile_payment_phone_id
        - location_tracking_consent_ios
        - location_tracking_consent_android
        - location_tracking_consent_web
        - pickups_completed_count
        - pickups_reassigned_count
        - pickup_issues_reported_count
        - pickup_reliability_score
        - focus
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
  - role: business
    permission:
      columns:
        - id
        - user_id
        - vehicle_type_id
        - agent_code
        - created_at
        - updated_at
        - is_verified
        - is_internal
        - onboarding_complete
        - status
        - is_available
        - auto_withdraw_commissions
        - focus
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - user_id
        - vehicle_type_id
        - agent_code
        - created_at
        - updated_at
        - is_verified
        - is_internal
        - onboarding_complete
        - status
        - is_available
        - auto_withdraw_commissions
        - focus
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - user_id
        - vehicle_type_id
        - agent_code
        - created_at
        - updated_at
        - is_verified
        - is_internal
        - onboarding_complete
        - status
        - is_available
        - auto_withdraw_commissions
        - focus
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: agent
    permission:
      columns:
        - vehicle_type_id
        - updated_at
        - is_verified
        - onboarding_complete
        - auto_withdraw_commissions
        - mobile_payment_phone_id
        - location_tracking_consent_ios
        - location_tracking_consent_android
        - location_tracking_consent_web
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
      check: null
