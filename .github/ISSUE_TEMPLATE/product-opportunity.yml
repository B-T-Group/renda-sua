name: Product Opportunity
description: Filed by Product Intelligence for Product & UX / Principal Engineer review. Not a build ticket.
title: "[Opportunity] "
labels: ["product-intelligence"]
body:
  - type: dropdown
    id: opportunity_type
    attributes:
      label: Opportunity type
      options:
        - New Feature
        - UX Improvement
        - Competitive Gap
        - Market Opportunity
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or business problem exists?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Code signals, UX observations, market/competitive evidence. Separate facts from hypotheses.
    validations:
      required: true
  - type: textarea
    id: current_capability
    attributes:
      label: Current RendaSua capability
      description: What already exists in the product/codebase that relates?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: competitive_examples
    attributes:
      label: Competitive examples
      description: Optional. Do not recommend solely because competitors have it.
  - type: textarea
    id: expected_impact
    attributes:
      label: Expected impact
      description: User impact, business impact, strategic importance.
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: validation_experiment
    attributes:
      label: Validation experiment
      description: Cheapest way to test the hypothesis before building.
    validations:
      required: true
  - type: textarea
    id: related_code
    attributes:
      label: Related code/features
      description: Paths, modules, existing APIs, or unfinished work that could be reused.
  - type: textarea
    id: agent_recommendation
    attributes:
      label: Agent recommendation
      description: Prioritized recommendation and suggested next owner (Product & UX vs Principal Engineer).
    validations:
      required: true
