table:
  name: failed_pickups
  schema: public
object_relationships:
  - name: failure_reason
    using:
      foreign_key_constraint_on: reason_id
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: business
    using:
      foreign_key_constraint_on: business_id
select_permissions:
  - role: business
    permission:
      columns:
        - id
        - order_id
        - business_id
        - reason_id
        - notes
        - status
        - refund_amount
        - fee_retained
        - currency
        - fulfillment_method
        - created_at
        - updated_at
      filter:
        business:
          user:
            id:
              _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - order_id
        - business_id
        - reason_id
        - notes
        - status
        - refund_amount
        - fee_retained
        - currency
        - fulfillment_method
        - created_at
        - updated_at
      filter:
        order:
          client:
            user:
              id:
                _eq: X-Hasura-User-Id
