table:
  name: merchant_engagement_sends
  schema: public
object_relationships:
  - name: business
    using:
      foreign_key_constraint_on: business_id
select_permissions:
  - role: business
    permission:
      columns:
        - id
        - business_id
        - push_id
        - channel
        - sent_at
        - metadata
      filter:
        business:
          user:
            id:
              _eq: X-Hasura-User-Id
insert_permissions: []
update_permissions: []
delete_permissions: []
