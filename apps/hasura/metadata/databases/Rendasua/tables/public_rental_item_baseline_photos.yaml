table:
  name: rental_item_baseline_photos
  schema: public
object_relationships:
  - name: rental_item
    using:
      foreign_key_constraint_on: rental_item_id
select_permissions:
  - role: business
    permission:
      columns:
        - id
        - rental_item_id
        - slot_key
        - status
        - captured_at
        - captured_at_source
        - capture_source
        - created_at
      filter:
        rental_item:
          business:
            user:
              id:
                _eq: X-Hasura-User-Id
