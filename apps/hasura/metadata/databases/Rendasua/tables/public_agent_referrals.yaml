table:
  name: agent_referrals
  schema: public
object_relationships:
  - name: referred_agent
    using:
      foreign_key_constraint_on: referred_agent_id
  - name: referring_agent
    using:
      foreign_key_constraint_on: referring_agent_id
  - name: referrer_business
    using:
      foreign_key_constraint_on: referrer_business_id
array_relationships:
  - name: referral_bonus_distributions
    using:
      foreign_key_constraint_on:
        column: agent_referral_id
        table:
          name: referral_bonus_distributions
          schema: public
