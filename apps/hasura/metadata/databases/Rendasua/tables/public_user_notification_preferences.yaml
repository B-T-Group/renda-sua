        - push_enabled
        - email_enabled
        - sms_enabled
        - whatsapp_enabled
        - whatsapp_opted_in_at
        - whatsapp_informational_enabled
        - marketing_enabled
        - order_updates
        - chat
        - marketplace
        - reminders
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
# WhatsApp opt-in columns are intentionally omitted from update/insert —
# Nest PATCH /notifications/preferences enforces verified-phone eligibility.
