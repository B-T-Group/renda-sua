table:
  name: user_recipients
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: address
    using:
      foreign_key_constraint_on: address_id
# user_id must be insertable: CreateRecipient sets it and Hasura hides
# columns that are not listed from user_recipients_insert_input.
insert_permissions:
  - role: agent
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - country
        - name
        - notify_whatsapp
        - phone
        - address_id
        - user_id
  - role: business
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - country
        - name
        - notify_whatsapp
        - phone
        - address_id
        - user_id
  - role: client
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - country
        - name
        - notify_whatsapp
        - phone
        - address_id
        - user_id
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - country
        - name
        - notify_whatsapp
        - phone
        - address_id
        - user_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - user_id
        - country
        - name
        - phone
        - notify_whatsapp
        - address_id
        - created_at
        - updated_at
