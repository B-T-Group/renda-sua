table:
  name: agent_contracts
  schema: public
object_relationships:
  - name: agent
    using:
      foreign_key_constraint_on: agent_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - agent_id
        - template_key
        - contract_number
        - status
        - signer_email
        - sent_at
        - viewed_at
        - signed_at
        - created_at
      filter:
        agent:
          user:
            id:
              _eq: X-Hasura-User-Id
