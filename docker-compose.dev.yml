# Local development dependencies (Redis for session/lockout stores).
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   yarn redis:up
services:
  redis:
    image: redis:7-alpine
    container_name: rendasua-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_dev_data:
