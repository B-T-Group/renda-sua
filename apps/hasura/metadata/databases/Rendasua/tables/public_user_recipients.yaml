table:
  name: user_recipients
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: agent
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - country
        - name
        - notify_whatsapp
        - phone
  - role: business
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - country
        - name
        - notify_whatsapp
        - phone
