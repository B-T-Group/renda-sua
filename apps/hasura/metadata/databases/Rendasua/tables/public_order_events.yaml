table:
  name: order_events
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - order_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - created_at
      filter:
        _and:
          - order:
              assigned_agent:
                user:
                  id:
                    _eq: X-Hasura-User-Id
          - event_type:
              _nin:
                - admin_cancel_progress
  - role: business
    permission:
      columns:
        - id
        - order_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - created_at
      filter:
        _and:
          - order:
              business:
                user:
                  id:
                    _eq: X-Hasura-User-Id
          - event_type:
              _nin:
                - admin_cancel_progress
  - role: client
    permission:
      columns:
        - id
        - order_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - created_at
      filter:
        _and:
          - order:
              client:
                user:
                  id:
                    _eq: X-Hasura-User-Id
          - event_type:
              _nin:
                - admin_cancel_progress
