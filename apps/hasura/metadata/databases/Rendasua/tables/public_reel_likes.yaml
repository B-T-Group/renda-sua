table:
  name: reel_likes
  schema: public
object_relationships:
  - name: reel
    using:
      foreign_key_constraint_on: reel_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: client
    permission:
      columns: [reel_id, user_id, created_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: client
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns: [reel_id, user_id]
delete_permissions:
  - role: client
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
