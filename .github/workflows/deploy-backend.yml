name: Deploy Backend to Lightsail Container

on:
  push:
    branches: [main, prod]
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'Dockerfile.backend'
      - 'Dockerfile.backend.prod'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

env:
  AWS_REGION: ca-central-1
  LIGHTSAIL_CONTAINER_NAME: backend
  ECR_REPOSITORY: groupe-bt-backend
  ECR_REGISTRY: 235680477887.dkr.ecr.ca-central-1.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-dev
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set deployment target
        run: |
          echo "LIGHTSAIL_CONTAINER_SERVICE=rendasua-service" >> $GITHUB_ENV
          echo "DEPLOYMENT_ENV=development" >> $GITHUB_ENV
          echo "Deploying to: ${{ env.LIGHTSAIL_CONTAINER_SERVICE }}"
          echo "Environment: ${{ env.DEPLOYMENT_ENV }}"

      - name: Build backend
        run: |
          cp apps/backend/.env.development ./apps/backend/.env
          # Use build script to ensure proper exit
          ./scripts/build-backend.sh
          cp apps/backend/.env dist/apps/backend/.env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      - name: Build and push container to ECR
        run: |
          IMAGE_TAG="${{ github.sha }}"
          LATEST_TAG="latest"
          DOCKERFILE="Dockerfile.backend"

          # Build the Docker image
          docker build -f $DOCKERFILE -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$LATEST_TAG

          # Push to ECR
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$LATEST_TAG

          # Store the image URI and tag for deployment
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Smoke test - verify runtime dependencies
        run: |
          echo "Running smoke test to verify all runtime dependencies are present..."
          
          # Run a quick smoke test inside the built image
          # This verifies that critical modules (redis, cookie-parser) can be required
          # and that main.js loads without MODULE_NOT_FOUND errors
          # AWS/Secrets Manager connection failures are expected and OK
          
          timeout 10s docker run --rm \
            -e NODE_ENV=development \
            -e DEPLOYMENT_ENV=development \
            -e ENABLE_CLOUDWATCH=false \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            node -e "
              try {
                console.log('✓ Testing cookie-parser...');
                require('cookie-parser');
                console.log('✓ Testing redis...');
                require('redis');
                console.log('✓ Testing main application module...');
                require('./src/main.js');
                console.log('✓ All critical modules loaded successfully');
                process.exit(0);
              } catch (err) {
                if (err.code === 'MODULE_NOT_FOUND') {
                  console.error('✗ SMOKE TEST FAILED: Missing runtime dependency');
                  console.error(err.message);
                  process.exit(1);
                }
                // Other errors (AWS, Secrets Manager, etc.) are OK for smoke test
                console.log('✓ Module resolution successful (runtime errors are OK for smoke test)');
                process.exit(0);
              }
            " || exit_code=$?
          
          if [ "${exit_code:-0}" -eq 124 ] || [ "${exit_code:-0}" -eq 137 ]; then
            echo "✓ Container started successfully (timeout is OK - main.js is loading)"
            exit 0
          elif [ "${exit_code:-0}" -ne 0 ]; then
            echo "✗ Smoke test failed with exit code $exit_code"
            exit 1
          fi
          
          echo "✓ Smoke test passed - all runtime dependencies present"

      - name: Deploy to Lightsail using ECR image (with retry)
        run: |
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Deployment attempt $attempt/$max_attempts..."
            
            if aws lightsail create-container-service-deployment \
              --service-name ${{ env.LIGHTSAIL_CONTAINER_SERVICE }} \
              --containers '{
                "backend": {
                  "image": "'${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'",
                  "ports": {
                    "3000": "HTTP"
                  },
                  "environment": {
                    "NODE_ENV": "${{ env.DEPLOYMENT_ENV }}",
                    "DEPLOYMENT_ENV": "${{ env.DEPLOYMENT_ENV }}",
                    "GIT_SHA": "${{ github.sha }}",
                    "SENTRY_DSN": "${{ secrets.SENTRY_DSN }}",
                    "AWS_ACCESS_KEY_ID": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                    "AWS_SECRET_ACCESS_KEY": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                    "AWS_REGION": "${{ env.AWS_REGION }}",
                    "REDIS_HOST": "rendasua-service.service.local",
                    "REDIS_PORT": "6379"
                  }
                },
                "redis": {
                  "image": "redis:7-alpine",
                  "command": ["redis-server", "--save", "", "--appendonly", "no"],
                  "ports": {
                    "6379": "TCP"
                  }
                }
              }' \
              --public-endpoint '{
                "containerName": "backend",
                "containerPort": 3000,
                "healthCheck": {
                  "healthyThreshold": 2,
                  "unhealthyThreshold": 2,
                  "timeoutSeconds": 5,
                  "intervalSeconds": 10,
                  "path": "/api/health",
                  "successCodes": "200-399"
                }
              }'; then
              echo "✅ Deployment initiated successfully!"
              break
            else
              exit_code=$?
              echo "⚠️ Deployment attempt $attempt failed with exit code $exit_code"
              
              if [ $attempt -lt $max_attempts ]; then
                sleep_time=$((attempt * 15))
                echo "Waiting ${sleep_time}s before retry..."
                sleep $sleep_time
              else
                echo "❌ All deployment attempts failed"
                exit 1
              fi
            fi
            
            attempt=$((attempt + 1))
          done

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to complete..."

          # Poll the deployment status until it's stable
          max_attempts=20
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Checking deployment status (attempt $attempt/$max_attempts)..."
            
            DEPLOYMENT_STATUS=$(aws lightsail get-container-services \
              --service-name ${{ env.LIGHTSAIL_CONTAINER_SERVICE }} \
              --query 'containerServices[0].state' \
              --output text)
            
            echo "Current deployment status: $DEPLOYMENT_STATUS"
            
            if [ "$DEPLOYMENT_STATUS" = "RUNNING" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$DEPLOYMENT_STATUS" = "FAILED" ]; then
              echo "❌ Deployment failed!"
              exit 1
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 30 seconds before next check..."
              sleep 30
            fi
            
            attempt=$((attempt + 1))
          done

          if [ $attempt -gt $max_attempts ]; then
            echo "❌ Deployment timeout after $max_attempts attempts"
            exit 1
          fi

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(aws lightsail get-container-services \
            --service-name ${{ env.LIGHTSAIL_CONTAINER_SERVICE }} \
            --query 'containerServices[0].url' \
            --output text)
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "service-url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          sleep 30

          # Test the health endpoint  
          curl -f ${{ env.SERVICE_URL }}api/health || {
            echo "Health check failed"
            exit 1
          }

          echo "Deployment successful! Service is available at: ${{ env.SERVICE_URL }}"

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Backend deployed successfully!
              
              **Service URL:** ${{ env.SERVICE_URL }}
              **Image:** ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
              **Environment:** ${{ env.DEPLOYMENT_ENV }}
              **Dockerfile:** ${{ env.DOCKERFILE }}
              **Deployment Time:** ${{ github.event.head_commit.timestamp }}`
            })

  # Prod only: the backend must not roll out before the prod Hasura apply for the
  # same commit has succeeded (new Nest code can depend on new migrations).
  # - push that touches Hasura paths: wait for "Apply Hasura migrations and metadata"
  #   on this SHA and require success (failure/cancel blocks the deploy).
  # - push that touches no Hasura paths: no Hasura run is triggered, proceed.
  # - workflow_dispatch: manual run, no gate.
  wait-for-hasura-prod:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Hasura production apply on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Event is $EVENT_NAME (manual); not gating on Hasura."
            exit 0
          fi

          HASURA_PATHS='^(apps/hasura/|\.github/actions/apply-hasura/|\.github/workflows/hasura-apply\.yml$)'
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$SHA" | grep -Eq "$HASURA_PATHS"; then
              EXPECT=yes
            else
              EXPECT=no
            fi
          else
            EXPECT=unknown
          fi
          echo "Hasura changes in this push: $EXPECT"
          if [ "$EXPECT" = "no" ]; then
            echo "No Hasura files changed; no Hasura apply to wait for."
            exit 0
          fi

          # Wait for the Hasura run for this SHA to appear.
          if [ "$EXPECT" = "yes" ]; then appear_limit=40; else appear_limit=9; fi
          RUN_ID=""
          for i in $(seq 1 "$appear_limit"); do
            RUN_ID=$(gh api "repos/$REPO/actions/workflows/hasura-apply.yml/runs?head_sha=$SHA&event=push&branch=prod&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            [ -n "$RUN_ID" ] && break
            sleep 15
          done
          if [ -z "$RUN_ID" ]; then
            if [ "$EXPECT" = "yes" ]; then
              echo "::error::Hasura files changed but no Hasura apply run found for $SHA"
              exit 1
            fi
            echo "No Hasura apply run for $SHA; proceeding."
            exit 0
          fi
          echo "Waiting on Hasura run https://github.com/$REPO/actions/runs/$RUN_ID"

          while true; do
            read -r STATUS CONCLUSION < <(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '"\(.status) \(.conclusion // "none")"')
            echo "Hasura run status=$STATUS conclusion=$CONCLUSION"
            [ "$STATUS" = "completed" ] && break
            sleep 20
          done
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Hasura production apply concluded '$CONCLUSION'; blocking backend deploy."
            exit 1
          fi
          echo "Hasura production apply succeeded."

  build-and-deploy-prod:
    needs: wait-for-hasura-prod
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set deployment target
        run: |
          echo "LIGHTSAIL_CONTAINER_SERVICE=rendasua-production-service" >> $GITHUB_ENV
          echo "DEPLOYMENT_ENV=production" >> $GITHUB_ENV
          echo "Deploying to: ${{ env.LIGHTSAIL_CONTAINER_SERVICE }}"
          echo "Environment: ${{ env.DEPLOYMENT_ENV }}"

      - name: Build backend
        run: |
          cp apps/backend/.env.production ./apps/backend/.env
          # Use build script to ensure proper exit
          ./scripts/build-backend.sh
          cp apps/backend/.env dist/apps/backend/.env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      - name: Build and push container to ECR
        run: |
          IMAGE_TAG="production-latest"
          LATEST_TAG="production-latest"
          DOCKERFILE="Dockerfile.backend.prod"

          # Build the Docker image
          docker build -f $DOCKERFILE -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$LATEST_TAG

          # Push to ECR
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$LATEST_TAG

          # Store the image URI and tag for deployment
          echo "IMAGE_URI=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Smoke test - verify runtime dependencies
        run: |
          echo "Running smoke test to verify all runtime dependencies are present..."
          
          # Run a quick smoke test inside the built image
          # This verifies that critical modules (redis, cookie-parser) can be required
          # and that main.js loads without MODULE_NOT_FOUND errors
          # AWS/Secrets Manager connection failures are expected and OK
          
          timeout 10s docker run --rm \
            -e NODE_ENV=production \
            -e DEPLOYMENT_ENV=production \
            -e ENABLE_CLOUDWATCH=false \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            node -e "
              try {
                console.log('✓ Testing cookie-parser...');
                require('cookie-parser');
                console.log('✓ Testing redis...');
                require('redis');
                console.log('✓ Testing main application module...');
                require('./src/main.js');
                console.log('✓ All critical modules loaded successfully');
                process.exit(0);
              } catch (err) {
                if (err.code === 'MODULE_NOT_FOUND') {
                  console.error('✗ SMOKE TEST FAILED: Missing runtime dependency');
                  console.error(err.message);
                  process.exit(1);
                }
                // Other errors (AWS, Secrets Manager, etc.) are OK for smoke test
                console.log('✓ Module resolution successful (runtime errors are OK for smoke test)');
                process.exit(0);
              }
            " || exit_code=$?
          
          if [ "${exit_code:-0}" -eq 124 ] || [ "${exit_code:-0}" -eq 137 ]; then
            echo "✓ Container started successfully (timeout is OK - main.js is loading)"
            exit 0
          elif [ "${exit_code:-0}" -ne 0 ]; then
            echo "✗ Smoke test failed with exit code $exit_code"
            exit 1
          fi
          
          echo "✓ Smoke test passed - all runtime dependencies present"

      - name: Deploy to Lightsail using ECR image (with retry)
        run: |
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Deployment attempt $attempt/$max_attempts..."
            
            if aws lightsail create-container-service-deployment \
              --service-name ${{ env.LIGHTSAIL_CONTAINER_SERVICE }} \
              --containers '{
                "backend": {
                  "image": "'${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'",
                  "ports": {
                    "3000": "HTTP"
                  },
                            "environment": {
              "NODE_ENV": "${{ env.DEPLOYMENT_ENV }}",
              "DEPLOYMENT_ENV": "${{ env.DEPLOYMENT_ENV }}",
              "GIT_SHA": "${{ github.sha }}",
              "SENTRY_DSN": "${{ secrets.SENTRY_DSN }}",
              "AWS_ACCESS_KEY_ID": "${{ secrets.AWS_ACCESS_KEY_ID }}",
              "AWS_SECRET_ACCESS_KEY": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
              "AWS_REGION": "${{ env.AWS_REGION }}"
            }
                }
              }' \
              --public-endpoint '{
                "containerName": "backend",
                "containerPort": 3000,
                "healthCheck": {
                  "healthyThreshold": 2,
                  "unhealthyThreshold": 2,
                  "timeoutSeconds": 5,
                  "intervalSeconds": 10,
                  "path": "/api/health",
                  "successCodes": "200-399"
                }
              }'; then
              echo "✅ Deployment initiated successfully!"
              break
            else
              exit_code=$?
              echo "⚠️ Deployment attempt $attempt failed with exit code $exit_code"
              
              if [ $attempt -lt $max_attempts ]; then
                sleep_time=$((attempt * 15))
                echo "Waiting ${sleep_time}s before retry..."
                sleep $sleep_time
              else
                echo "❌ All deployment attempts failed"
                exit 1
              fi
            fi
            
            attempt=$((attempt + 1))
          done

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to complete..."

          # Poll the deployment status until it's stable
          max_attempts=20
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Checking deployment status (attempt $attempt/$max_attempts)..."
            
            DEPLOYMENT_STATUS=$(aws lightsail get-container-services \
              --service-name ${{ env.LIGHTSAIL_CONTAINER_SERVICE }} \
              --query 'containerServices[0].state' \
              --output text)
            
            echo "Current deployment status: $DEPLOYMENT_STATUS"
            
            if [ "$DEPLOYMENT_STATUS" = "RUNNING" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$DEPLOYMENT_STATUS" = "FAILED" ]; then
              echo "❌ Deployment failed!"
              exit 1
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 30 seconds before next check..."
              sleep 30
            fi
            
            attempt=$((attempt + 1))
          done

          if [ $attempt -gt $max_attempts ]; then
            echo "❌ Deployment timeout after $max_attempts attempts"
            exit 1
          fi

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(aws lightsail get-container-services \
            --service-name ${{ env.LIGHTSAIL_CONTAINER_SERVICE }} \
            --query 'containerServices[0].url' \
            --output text)
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "service-url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          sleep 30

          # Test the health endpoint  
          curl -f ${{ env.SERVICE_URL }}api/health || {
            echo "Health check failed"
            exit 1
          }

          echo "Deployment successful! Service is available at: ${{ env.SERVICE_URL }}"

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Backend deployed successfully!
              
              **Service URL:** ${{ env.SERVICE_URL }}
              **Image:** ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
              **Environment:** ${{ env.DEPLOYMENT_ENV }}
              **Dockerfile:** ${{ env.DOCKERFILE }}
              **Deployment Time:** ${{ github.event.head_commit.timestamp }}`
            })
