table:
  name: item_variant_images
  schema: public
object_relationships:
  - name: item_variant
    using:
      foreign_key_constraint_on: item_variant_id
insert_permissions:
  - role: business
    permission:
      check:
        item_variant:
          item:
            business:
              user:
                id:
                  _eq: X-Hasura-User-Id
      columns:
        - item_variant_id
        - image_url
        - s3_key
        - alt_text
        - caption
        - display_order
        - is_primary
        - original_image_url
        - original_s3_key
        - content_hash
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - item_variant_id
        - image_url
        - alt_text
        - caption
        - display_order
        - is_primary
        - is_ai_cleaned
        - original_image_url
        - enhanced_image_url
        - active_version
        - thumbnail
        - thumbnail_status
        - display_url
        - created_at
        - updated_at
      filter:
        item_variant:
          is_active:
            _eq: true
  - role: anonymous
    permission:
      columns:
        - id
        - item_variant_id
        - image_url
        - alt_text
        - caption
        - display_order
        - is_primary
        - is_ai_cleaned
        - original_image_url
        - enhanced_image_url
        - active_version
        - thumbnail
        - thumbnail_status
        - display_url
        - created_at
        - updated_at
      filter:
        item_variant:
          is_active:
            _eq: true
  - role: business
    permission:
      columns:
        - id
        - item_variant_id
        - image_url
        - alt_text
        - caption
        - display_order
        - is_primary
        - is_ai_cleaned
        - original_image_url
        - original_s3_key
        - enhanced_image_url
        - enhanced_s3_key
        - active_version
        - enhanced_at
        - reverted_at
        - content_hash
        - thumbnail
        - thumbnail_status
        - display_url
        - created_at
        - updated_at
      filter:
        item_variant:
          item:
            business:
              user:
                id:
                  _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - item_variant_id
        - image_url
        - alt_text
        - caption
        - display_order
        - is_primary
        - is_ai_cleaned
        - original_image_url
        - enhanced_image_url
        - active_version
        - thumbnail
        - thumbnail_status
        - display_url
        - created_at
        - updated_at
      filter:
        item_variant:
          is_active:
            _eq: true
  - role: user
    permission:
      columns:
        - id
        - item_variant_id
        - image_url
        - alt_text
        - caption
        - display_order
        - is_primary
        - is_ai_cleaned
        - original_image_url
        - enhanced_image_url
        - active_version
        - thumbnail
        - thumbnail_status
        - display_url
        - created_at
        - updated_at
      filter:
        item_variant:
          is_active:
            _eq: true
update_permissions:
  - role: business
    permission:
      columns:
        - image_url
        - s3_key
        - alt_text
        - caption
        - display_order
        - is_primary
        - is_ai_cleaned
        - original_image_url
        - original_s3_key
        - enhanced_image_url
        - enhanced_s3_key
        - active_version
        - enhanced_at
        - reverted_at
        - content_hash
        - updated_at
      filter:
        item_variant:
          item:
            business:
              user:
                id:
                  _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: business
    permission:
      filter:
        item_variant:
          item:
            business:
              user:
                id:
                  _eq: X-Hasura-User-Id
