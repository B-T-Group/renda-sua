name: Backend CI

on:
  pull_request:
    branches: [main, prod]
    paths:
      - 'apps/backend/**'
      - 'apps/hasura/**'
      - 'package.json'
      - 'yarn.lock'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, prod]
    paths:
      - 'apps/backend/**'
      - 'apps/hasura/**'
      - 'package.json'
      - 'yarn.lock'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Boot smoke test
        run: npx nx test backend --testPathPattern=app-boot-smoke --skip-nx-cache

  money-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Decline refund Postgres spec
        env:
          CI: 'true'
          DEDICATED_PG_TEMPLATE: template1
          DECLINE_REFUND_PG: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: npx nx test backend --testPathPattern=money.qa.pg --skip-nx-cache --verbose

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Decline refund and ranking unit specs
        run: npx nx test backend --testPathPattern='rentals/(pickup-decline|decline-ranking)' --testPathIgnorePatterns=money.qa.pg --skip-nx-cache
