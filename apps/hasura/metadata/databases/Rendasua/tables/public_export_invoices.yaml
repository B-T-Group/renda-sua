table:
  name: export_invoices
  schema: public
object_relationships:
  - name: export_order
    using:
      foreign_key_constraint_on: export_order_id
select_permissions:
  - role: client
    permission:
      columns:
        - id
        - export_order_id
        - kind
        - document_id
        - version_number
        - subtotal
        - fees_total
        - tax_total
        - grand_total
        - deposit_rate
        - deposit_amount
        - balance_amount
        - credit_applied
        - validity_days
        - valid_until
        - client_approved_at
        - locked
        - created_at
        - updated_at
      filter:
        export_order:
          client_user_id:
            _eq: X-Hasura-User-Id
