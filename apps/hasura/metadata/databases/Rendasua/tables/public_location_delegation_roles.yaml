table:
  name: location_delegation_roles
  schema: public
array_relationships:
  - name: role_permissions
    using:
      foreign_key_constraint_on:
        column: role_id
        table:
          name: location_delegation_role_permissions
          schema: public
  - name: invites
    using:
      foreign_key_constraint_on:
        column: role_id
        table:
          name: location_delegation_invites
          schema: public
  - name: delegations
    using:
      foreign_key_constraint_on:
        column: role_id
        table:
          name: location_delegations
          schema: public
select_permissions:
  - role: business
    permission:
      columns:
        - id
        - key
        - name
        - description
        - is_system
        - is_assignable
        - created_at
      filter: {}
