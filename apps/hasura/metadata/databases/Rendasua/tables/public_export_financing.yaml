table:
  name: export_financing
  schema: public
object_relationships:
  - name: export_order
    using:
      foreign_key_constraint_on: export_order_id
select_permissions:
  - role: client
    permission:
      columns:
        - id
        - export_order_id
        - option_days
        - approved
        - due_date
        - principal
        - status
        - created_at
        - updated_at
      filter:
        export_order:
          client_user_id:
            _eq: X-Hasura-User-Id
