table:
  name: restock_alerts
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: item
    using:
      foreign_key_constraint_on: item_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - user_id
        - item_id
        - alert_enabled
        - state
        - disarm_reason
        - armed_at
        - expires_at
        - last_alert_at
        - sent_count
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: business
    permission:
      columns:
        - id
        - user_id
        - item_id
        - alert_enabled
        - state
        - disarm_reason
        - armed_at
        - expires_at
        - last_alert_at
        - sent_count
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - user_id
        - item_id
        - alert_enabled
        - state
        - disarm_reason
        - armed_at
        - expires_at
        - last_alert_at
        - sent_count
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - user_id
        - item_id
        - alert_enabled
        - state
        - disarm_reason
        - armed_at
        - expires_at
        - last_alert_at
        - sent_count
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: agent
    permission:
      columns:
        - item_id
        - alert_enabled
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
  - role: business
    permission:
      columns:
        - item_id
        - alert_enabled
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - item_id
        - alert_enabled
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - item_id
        - alert_enabled
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
update_permissions:
  - role: agent
    permission:
      columns:
        - alert_enabled
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
  - role: business
    permission:
      columns:
        - alert_enabled
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
  - role: client
    permission:
      columns:
        - alert_enabled
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
  - role: user
    permission:
      columns:
        - alert_enabled
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
