table:
  name: user_mobile_payment_phones
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: last_verification_transaction
    using:
      foreign_key_constraint_on: last_verification_transaction_id
array_relationships:
  - name: business_locations
    using:
      foreign_key_constraint_on:
        column: mobile_payment_phone_id
        table:
          name: business_locations
          schema: public
  - name: agents
    using:
      foreign_key_constraint_on:
        column: mobile_payment_phone_id
        table:
          name: agents
          schema: public
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - user_id
        - phone_e164
        - is_verified
        - verified_at
        - last_verification_transaction_id
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: business
    permission:
      columns:
        - id
        - user_id
        - phone_e164
        - is_verified
        - verified_at
        - last_verification_transaction_id
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - user_id
        - phone_e164
        - is_verified
        - verified_at
        - last_verification_transaction_id
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - user_id
        - phone_e164
        - is_verified
        - verified_at
        - last_verification_transaction_id
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
