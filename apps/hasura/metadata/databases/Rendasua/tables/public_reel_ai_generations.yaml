table:
  name: reel_ai_generations
  schema: public
object_relationships:
  - name: business
    using:
      foreign_key_constraint_on: business_id
  - name: reel
    using:
      foreign_key_constraint_on: reel_id
select_permissions:
  - role: business
    permission:
      columns:
        - id
        - reel_id
        - business_id
        - model
        - preset_id
        - user_prompt
        - status
        - error
        - provider
        - generation_tier
        - fallback_used
        - created_at
        - updated_at
      filter:
        business:
          user_id:
            _eq: X-Hasura-User-Id
