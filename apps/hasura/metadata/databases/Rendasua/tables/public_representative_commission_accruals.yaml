table:
  name: representative_commission_accruals
  schema: public
object_relationships:
  - name: agent
    using:
      foreign_key_constraint_on: agent_id
  - name: business
    using:
      foreign_key_constraint_on: business_id
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - order_id
        - agent_id
        - business_id
        - currency
        - eligible_amount
        - gmv_amount
        - self_purchase
        - status
        - statement_id
        - created_at
      filter:
        agent:
          user:
            id:
              _eq: X-Hasura-User-Id
