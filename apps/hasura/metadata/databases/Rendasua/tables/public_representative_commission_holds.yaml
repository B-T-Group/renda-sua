table:
  name: representative_commission_holds
  schema: public
object_relationships:
  - name: agent
    using:
      foreign_key_constraint_on: agent_id
  - name: statement
    using:
      foreign_key_constraint_on: statement_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - statement_id
        - agent_id
        - currency
        - amount
        - remaining
        - release_at
        - status
      filter:
        agent:
          user:
            id:
              _eq: X-Hasura-User-Id
