table:
  name: order_events
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - order_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - created_at
      filter:
        order:
          assigned_agent:
            user:
              id:
                _eq: X-Hasura-User-Id
  - role: business
    permission:
      columns:
        - id
        - order_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - created_at
      filter:
        order:
          business:
            user:
              id:
                _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - order_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - created_at
      filter:
        order:
          client:
            user:
              id:
                _eq: X-Hasura-User-Id
