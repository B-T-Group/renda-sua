table:
  name: representative_commission_deductions
  schema: public
object_relationships:
  - name: agent
    using:
      foreign_key_constraint_on: agent_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - agent_id
        - currency
        - order_id
        - amount
        - remaining
        - reason
        - created_at
      filter:
        agent:
          user:
            id:
              _eq: X-Hasura-User-Id
