table:
  name: restock_events
  schema: public
object_relationships:
  - name: item
    using:
      foreign_key_constraint_on: item_id
  - name: inventory
    using:
      foreign_key_constraint_on: inventory_id
  - name: business_location
    using:
      foreign_key_constraint_on: business_location_id
array_relationships:
  - name: sends
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: restock_alert_sends
          schema: public
