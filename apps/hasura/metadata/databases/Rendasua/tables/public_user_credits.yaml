table:
  name: user_credits
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: created_by_user
    using:
      foreign_key_constraint_on: created_by
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: order_risk_incident
    using:
      foreign_key_constraint_on: order_risk_incident_id
  - name: referred_business
    using:
      foreign_key_constraint_on: referred_business_id
  - name: referred_agent
    using:
      foreign_key_constraint_on: referred_agent_id
