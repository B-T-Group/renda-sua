table:
  name: notification_events
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - created_at
        - notification_type
        - category
        - user_id
        - channel
        - status
        - provider_message_id
        - dedupe_key
        - entity_type
        - entity_id
        - error_code
        - meta
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: business
    permission:
      columns:
        - id
        - created_at
        - notification_type
        - category
        - user_id
        - channel
        - status
        - provider_message_id
        - dedupe_key
        - entity_type
        - entity_id
        - error_code
        - meta
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - created_at
        - notification_type
        - category
        - user_id
        - channel
        - status
        - provider_message_id
        - dedupe_key
        - entity_type
        - entity_id
        - error_code
        - meta
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - created_at
        - notification_type
        - category
        - user_id
        - channel
        - status
        - provider_message_id
        - dedupe_key
        - entity_type
        - entity_id
        - error_code
        - meta
      filter:
        user_id:
          _eq: X-Hasura-User-Id
