table:
  name: businesses
  schema: public
object_relationships:
  - name: account_type_info
    using:
      foreign_key_constraint_on: account_type
  - name: referring_agent
    using:
      foreign_key_constraint_on: referred_by_agent_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: account_type_history
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_account_type_history
          schema: public
  - name: ai_token_usage
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_ai_token_usage
          schema: public
  - name: business_addresses
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: business_addresses
          schema: public
  - name: business_contracts
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_contracts
          schema: public
  - name: business_referral_payouts
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_referral_payouts
          schema: public
  - name: business_referral_reviews
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_referral_reviews
          schema: public
  - name: business_locations
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: business_locations
          schema: public
  - name: items
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: items
          schema: public
  - name: lifecycle_status_history
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_lifecycle_status_history
          schema: public
  - name: merchant_agreement_acceptances
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_merchant_agreement_acceptances
          schema: public
  - name: orders
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: orders
          schema: public
  - name: payment_accounts
    using:
      foreign_key_constraint_on:
        column: business_id
        table:
          name: business_payment_accounts
          schema: public
  - name: rental_bookings
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: rental_bookings
          schema: public
  - name: rental_item_images
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: rental_item_images
          schema: public
  - name: rental_items
    using:
      manual_configuration:
        column_mapping:
          id: business_id
        insertion_order: null
        remote_table:
          name: rental_items
          schema: public
insert_permissions:
  - role: agent
    permission:
      check: {}
      columns:
        - id
        - user_id
        - name
        - main_interest
        - created_at
        - updated_at
  - role: business
    permission:
      check:
        user:
          id:
            _eq: X-Hasura-User-Id
      columns:
        - user_id
        - name
        - main_interest
  - role: client
    permission:
      check: {}
      columns:
        - id
        - user_id
        - name
        - main_interest
        - created_at
        - updated_at
  - role: user
    permission:
      check: {}
      columns:
        - id
        - user_id
        - name
        - main_interest
        - created_at
        - updated_at
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - user_id
        - name
        - main_interest
        - created_at
        - updated_at
        - is_admin
        - is_verified
        - lifecycle_status
        - can_accept_orders
        - accepting_orders
        - reliability_tier
        - ai_tokens
        - account_type
        - account_type_locked_until
      filter: {}
  - role: anonymous
    permission:
      columns:
        - id
        - name
        - created_at
        - updated_at
        - is_admin
        - is_verified
        - lifecycle_status
        - can_accept_orders
        - merchant_agreement_version
        - merchant_agreement_accepted_at
        - account_type
        - accepting_orders
        - paused_until
        - reliability_tier
      filter: {}
  - role: business
    permission:
      columns:
        - id
        - user_id
        - name
        - main_interest
        - created_at
        - updated_at
        - is_admin
        - is_verified
        - lifecycle_status
        - can_accept_orders
        - ai_tokens
        - auto_enhance_enabled
        - merchant_agreement_version
        - merchant_agreement_accepted_at
        - referred_by_agent_id
        - referral_code_used
        - account_type
        - account_type_locked_until
        - acceptance_timeout_seconds
        - future_acceptance_timeout_seconds
        - order_activation_lead_minutes
        - default_estimated_prep_minutes
        - orders_accepted_count
        - orders_auto_declined_count
        - orders_merchant_cancelled_count
        - acceptance_latency_sum_ms
        - reliability_score
        - reliability_tier
        - accepting_orders
        - paused_until
        - auto_decline_rolling_30d
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
  - role: client
    permission:
      columns:
        - id
        - user_id
        - name
        - main_interest
        - created_at
        - updated_at
        - is_admin
        - is_verified
        - lifecycle_status
        - can_accept_orders
        - account_type
        - accepting_orders
        - paused_until
        - reliability_tier
      filter: {}
update_permissions:
  - role: business
    permission:
      columns:
        - name
        - updated_at
        - acceptance_timeout_seconds
        - future_acceptance_timeout_seconds
        - order_activation_lead_minutes
        - default_estimated_prep_minutes
        - accepting_orders
        - paused_until
        - auto_enhance_enabled
      filter:
        user:
          id:
            _eq: X-Hasura-User-Id
      check: null
